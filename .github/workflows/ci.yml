name: CI

on:
  # Toutes les PR (y compris les PR empilées qui ciblent une autre branche de travail)
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Valeurs factices : le build ne contacte pas Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Migrations et tests RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Démarrer Postgres et appliquer les migrations
        run: supabase db start

      - name: Lint SQL
        run: supabase db lint --level warning --fail-on warning

      - name: Tests pgTAP
        run: supabase test db

      - name: Types TypeScript à jour
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
